# Self-prompting schedule. Each routine is a prompt the crew sends to itself.
# cron fields: minute hour day-of-month month day-of-week

defaults:
  timezone: Europe/London
  model: grok-4.7
  days_back: 7

# Handles that exist ON X. Only these can be used with x_search's handle
# filter — an Instagram or TikTok handle here matches nothing and silently
# narrows the search to zero. Max 20, no @.
# TRANSCRIBED FROM A SCREENSHOT — verify each one before trusting the output.
x_watchlist:
  - darbyirl            # Darby Pappas — also Instagram, LinkedIn
  - nanadelrey          # Nana DelRey — also Instagram, TikTok, Substack
  - alexgoughcooper     # Alex Cooper — X only

# Everyone else we track. NOT usable as an x_search filter; these are passed
# to SCOUT as context so it knows whose names to look for on the open web.
# Format: handle | platforms | name
creators:
  - danimrodriguez      | Instagram          | Dani Rodriguez
  - giutheginger        | Instagram          | giutheginger
  - jfsephp             | Instagram          | Joseph Peterson
  - wellbycami          | Instagram          | Cami
  - isabelradford_      | Instagram, TikTok, YouTube | Isabel Radford
  - annanoellerinke     | TikTok, Instagram  | Anna Rinke
  - askcatgpt           | TikTok, Instagram  | CatGPT
  - morlliu             | TikTok, Instagram  | Mori Liu
  - dibratto            | TikTok, Instagram  | Christian Di Bratto
  - sopi.iscoding       | Instagram          | Sopi
  - localhostbarbie     | TikTok, Instagram, Substack | Jess Yin
  - mariah_mpls         | TikTok, Instagram  | Mariah Marcia
  - vlada.asana         | TikTok, Instagram  | Vlada Kandyba
  - genzbestie          | TikTok             | Megan Chin
  - var.aunevik         | TikTok             | Vlr
  - wetclaude           | TikTok             | Deana Burke
  - carmscrolls         | TikTok, Instagram, LinkedIn | Carmen Vicente
  - keevacummins        | TikTok             | Keeva Cummins
  - eugbrandstrat       | TikTok, Substack, LinkedIn | Eugene Healey
  - matirosenman        | TikTok             | Matt Rosenman
  - shwinnabego         | TikTok             | Ashwinn
  - peterreitano        | TikTok             | Peter Reitano
  - mirandadoesbrands   | TikTok, Instagram, Substack, YouTube | Miranda Does Brands
