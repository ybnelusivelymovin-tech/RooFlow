routines:

  # Discovery: open X search, NOT restricted to the watchlist, so new accounts
  # can surface. This is the one that finds people we do not yet know.
  - name: monday-outliers
    persona: scout
    cron: "0 8 * * 1"
    search: [x_open, web]
    task: |
      Find the outlier posts in our niche from the last {days_back} days.
      Search the niche widely — the point of this run is to surface accounts
      we do NOT already track. Rank by how far each post beat its own author's
      normal, not by raw size. Prefer small accounts with big posts.
    then: monday-hooks        # chain: my output becomes the next routine's input

  - name: monday-hooks
    persona: hooks
    chained_only: true        # never runs on its own clock
    search: []
    task: |
      Turn every post below into a reusable hook for our niche.
      Reject any hook that only worked because of who posted it.

  # Watchlist check: restricted to x_watchlist. Narrow by design.
  - name: watchlist-check
    persona: scout
    cron: "0 8 * * 4"
    search: [x]
    task: |
      Check only the accounts on our X watchlist. What did each post in the
      last {days_back} days that beat their own normal? If an account posted
      nothing notable, leave it out rather than padding the table.

  - name: wednesday-trends
    persona: trends
    cron: "0 8 * * 3"
    search: [x_open, web]
    task: |
      What language in our niche is measurably rising this week versus last?
      Terms and framings, not news. Mark anything we already posted about as
      cooling if it is cooling.

  - name: friday-review
    persona: editor
    cron: "0 16 * * 5"
    search: []
    task: |
      Here is what we published this week. Score each piece and say which
      pattern to repeat next week and which to stop. Be willing to say that
      nothing this week is worth repeating.
